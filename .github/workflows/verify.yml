name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Probe shebang script execution from TMPDIR
        run: |
          echo "python3=$(command -v python3)"
          python3 -c 'print("python-direct-ok")'
          SCRIPT="$TMPDIR/probe-coord-$$.sh"
          printf '%s\n' '#!/usr/bin/env python3' 'import sys' 'print("XUANJI_PORT=12345", flush=True)' 'sys.stderr.write("probe-stderr\n")' > "$SCRIPT"
          chmod 755 "$SCRIPT"
          "$SCRIPT" || echo "probe-exit=$?"
          /usr/bin/env python3 -c 'print("env-python-ok")'

      - name: Run all local gates
        run: bash scripts/verify-all.sh --skip-tauri-build

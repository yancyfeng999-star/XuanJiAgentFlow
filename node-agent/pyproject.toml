[project]
name = "xuanji-node-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.10",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.28",
  "pytest-asyncio>=0.24",
]

[tool.setuptools]
py-modules = ["app", "executor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuanji-coordinator"
version = "3.0.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.7",
  "pygments>=2.18",
  "uvicorn>=0.30",
]

[project.scripts]
xuanji-coordinator = "xuanji.__main__:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pytest-asyncio>=0.24",
  "pygments>=2.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
